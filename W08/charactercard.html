<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snortleblat</title>
    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>
</head>
<body>
    <div id="character-card">
        <img src="snortleblat.webp" alt="Snortleblat character image">
        <h1>Snortleblat</h1>
        <div id="stats">
            <p><strong>Class:</strong> <span id="character-class"></span></p>
            <p><strong>Level:</strong> <span id="character-level"></span></p>
            <p><strong>Health:</strong> <span id="character-health"></span></p>
            <div class="button-container">
                <button id="attack">Attacked</button>
                <button id="lvlup">Level Up</button>
            </div>
        </div>
    </div>
</body>
</html>
